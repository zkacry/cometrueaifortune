name: Build iOS (TestFlight)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager (CocoaPods-only plugins compatibility)
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Write .env from secrets
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > .env << EOF
          CLAUDE_API_KEY=${CLAUDE_API_KEY}
          CLAUDE_API_URL=https://api.anthropic.com/v1/messages
          CLAUDE_MODEL=claude-haiku-4-5-20251001

          DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
          DEEPSEEK_MODEL=deepseek-v4-flash

          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-3.1-flash-lite
          EOF

      - name: Setup Ruby / Bundler
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Build iOS (unsigned IPA)
        run: flutter build ios --release --no-codesign

      - name: Verify IPA exists
        run: |
          if [ -f build/ios/ipa/Runner.ipa ]; then
            echo "✅ Unsigned IPA built successfully"
            ls -lh build/ios/ipa/Runner.ipa
          else
            echo "❌ IPA not found"
            exit 1
          fi
