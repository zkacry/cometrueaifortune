name: myfortune
description: "AI記録占い - あなたの記憶を読んで占うAIアプリ"
publish_to: 'none'

version: 1.0.4+2108

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5

  # ローカルDB
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # HTTP通信（Claude API用）
  dio: ^5.8.0+1

  # 環境変数
  flutter_dotenv: ^5.2.1

  # 日付・数値
  intl: ^0.20.2

  # ローカル保存
  shared_preferences: ^2.5.3

  # グラフ
  fl_chart: ^0.70.2

  # プッシュ通知
  flutter_local_notifications: ^17.1.3
  permission_handler: ^12.0.3

  # アプリ内課金
  in_app_purchase: ^3.2.0

  # AdMob広告
  google_mobile_ads: ^5.1.0

  # google_mobile_adsのiOS podspecが webview_flutter_wkwebview に依存しているため、
  # 直接依存として明示しCocoaPods解決の曖昧さを解消する
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon_app.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/icons/
